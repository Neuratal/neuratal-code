name: Bug report
description: Something broke? Tell us what happened.
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: Expected X, saw Y. Steps to reproduce...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Neuratal Code version
      placeholder: e.g. 1.0.0 (or commit hash)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste anything relevant. Scrub secrets first.
    validations:
      required: false
